name: ledger_ai
description: 衡账 - 本地优先的 AI 记账 App（拍照识别 / 语音记账 / 智能分类）
publish_to: 'none'
version: 1.1.0+16

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.3.3
  intl: ^0.20.2
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  share_plus: ^12.0.0
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
